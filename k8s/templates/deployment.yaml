apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokosmari
  namespace: {{ .Release.Namespace }}
  labels:
    app: pokosmari
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: pokosmari
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pokosmari
    spec:
      # The pod calls nothing in the cluster or in Azure, so it holds no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # distroless's nonroot user by number: the kubelet can't verify the image's named one.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pokosmari
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          env:
            - name: PORT
              value: {{ .Values.container.port | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
